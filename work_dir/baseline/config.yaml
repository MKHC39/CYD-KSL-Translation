batch_size: 4
config: ./configs/baseline.yaml
dataset: KSL
dataset_info:
  dataset_root: ./dataset/KSL
  dict_path: ./preprocess/KSL/gloss_dict.npy
  evaluation_dir: ./evaluation/slr_eval
  evaluation_prefix: KSL-groundtruth
  task: islr
decode_mode: beam
device: 0
eval_interval: 1
evaluate_tool: python
feeder: dataset.KSL_pydata.KSLFeeder
feeder_args:
  datatype: video
  drop_ratio: 1.0
  frame_interval: 1
  image_scale: 1.0
  input_size: 224
  mode: train
  num_gloss: -1
ignore_weights: []
load_checkpoints: null
load_weights: null
log_interval: 10000
loss_weights:
  ConvCTC: 1.0
  Cp: 0.0005
  Cu: 0.0005
  Dist: 25.0
  SeqCTC: 1.0
model: slr_network.SLRModel
model_args:
  c2d_type: resnet18
  conv_type: 2
  num_classes: 100
  share_classifier: true
  use_bn: 1
  weight_norm: true
num_epoch: 80
num_worker: 10
optimizer_args:
  base_lr: 0.0001
  learning_ratio: 1
  nesterov: false
  optimizer: Adam
  start_epoch: 0
  step:
  - 40
  - 60
  weight_decay: 0.0001
phase: train
print_log: true
random_fix: true
random_seed: 0
save_interval: 5
test_batch_size: 4
work_dir: ./work_dir/baseline/
